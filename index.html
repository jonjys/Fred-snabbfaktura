<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>SnabbFaktura</title></head>
<body style="margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div id="m">Loading…</div>
<script>
(async()=>{
  try{
    let h='';
    for(let i=0;i<3;i++){
      const r=await fetch('./parts/raw'+i+'.txt');
      if(!r.ok) throw new Error('part '+i);
      h+=await r.text();
    }
    document.open();document.write(h);document.close();
  }catch(e){document.getElementById('m').textContent=String(e)}
})();
</script>
</body></html>
