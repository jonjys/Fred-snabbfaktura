<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invo — Invoice in seconds</title>
<meta name="description" content="Create Swedish invoices in 30 seconds. PDF, Swish, Bankgiro. No signup."/>
<meta property="og:title" content="Invo"/>
<meta property="og:description" content="Invoices in 30 seconds. Private by design."/>
<meta property="og:url" content="https://www.invoic.se"/>
<link rel="canonical" href="https://www.invoic.se"/>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
.box{text-align:center;padding:2rem}
.spin{width:28px;height:28px;border:3px solid #334155;border-top-color:#14b8a6;
border-radius:50%;animation:s .7s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div id="msg">Loading Invo…</div></div>
<script>
(async()=>{
  try{
    const urls = ['parts/c00.txt', 'parts/c01.txt', 'parts/c02.txt', 'parts/c03.txt', 'parts/c04.txt', 'parts/c05.txt', 'parts/c06.txt', 'parts/c07.txt', 'parts/c08.txt', 'parts/c09.txt', 'parts/c10.txt', 'parts/c11.txt', 'parts/c12.txt', 'parts/c13.txt', 'parts/c14.txt', 'parts/c15.txt', 'parts/c16.txt', 'parts/c17.txt', 'parts/c18.txt', 'parts/c19.txt', 'parts/c20.txt', 'parts/c21.txt', 'parts/c22.txt', 'parts/c23.txt', 'parts/c24.txt', 'parts/c25.txt', 'parts/c26.txt', 'parts/c27.txt', 'parts/c28.txt', 'parts/c29.txt', 'parts/c30.txt', 'parts/c31.txt', 'parts/c32.txt', 'parts/c33.txt'];
    const texts = await Promise.all(urls.map(u => fetch(u).then(r => { if(!r.ok) throw new Error(u+' '+r.status); return r.text(); })));
    const b64 = texts.join('');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Response(bin).body.pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('msg').innerHTML = '<p style="color:#f87171">Load failed</p><pre style="font-size:11px;color:#94a3b8;text-align:left;max-width:90vw;overflow:auto">'+e+'</pre>';
  }
})();
</script>
</body>
</html>
