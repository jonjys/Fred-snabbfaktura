<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SnabbFaktura</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
.box{text-align:center;padding:2rem}
.spin{width:28px;height:28px;border:3px solid #334155;border-top-color:#14b8a6;
border-radius:50%;animation:s .7s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
p{opacity:.7;font-size:.9rem}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p id="msg">Loading SnabbFaktura…</p></div>
<script>
(async()=>{
  try{
    const B64=`PLACEHOLDER_WILL_REPLACE`;
    const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Response(bin).body.pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('msg').innerHTML='<p style="color:#f87171">Load failed</p><pre style="font-size:11px;color:#94a3b8;text-align:left;max-width:90vw;overflow:auto">'+e+'</pre>';
  }
})();
</script>
</body>
</html>
